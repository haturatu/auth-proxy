name: CI & Lint

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect affected files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'cmd/**'
              - 'config/**'
              - 'database/**'
              - 'handlers/**'
              - 'logging/**'
              - 'middleware/**'
              - 'models/**'
              - 'router/**'
              - 'templates/**'
              - 'types/**'
              - 'utils/**'
              - 'worker/**'
              - 'go.mod'
              - 'go.sum'
              - 'run-demo.sh'
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose*.yaml'
              - 'tests/**'
              - '.env.example'
              - '.github/workflows/ci.yml'
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Run Go tests
        run: go test ./...

      - name: Run build
        run: go build -o auth-proxy-server ./cmd/server && go build -o admin-cli ./cmd/admin-cli

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # Temporary gofmt extraction; removed after committing formatted files.
      - name: Export Go 1.27 formatted files
        run: |
          gofmt -w .
          python3 - <<'PY'
          import json, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--', '*.go'], text=True).splitlines()
          for path in paths:
              with open(path, encoding='utf-8') as f:
                  print('FMT_FILE=' + json.dumps({'path': path, 'content': f.read()}, separators=(',', ':')))
          PY

      - name: Check formatting
        run: |
          gofmt_output=$(gofmt -l .)
          if [ -n "$gofmt_output" ]; then
            echo "The following files are not formatted correctly:"
            echo "$gofmt_output"
            exit 1
          fi
          echo "All files are correctly formatted."

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Docker / SQLite, PostgreSQL, MySQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build application image once
        env:
          TARGET_URL: http://example.invalid
          SESSION_SECRET: ci-only-session-secret-not-for-production
          XSRF_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          COMPOSE_PROJECT_NAME: auth-proxy-smoke
        run: docker compose -f compose.yaml build auth-proxy
      - name: Smoke test all database modes
        run: |
          for db in sqlite postgres mysql; do
            bash tests/compose-smoke.sh "$db"
          done

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test (race + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - run: go test -race -timeout=120s ./...
      - run: go vet ./...
