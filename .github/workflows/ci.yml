name: CI & Lint

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect affected files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'cmd/**'
              - 'config/**'
              - 'database/**'
              - 'handlers/**'
              - 'logging/**'
              - 'middleware/**'
              - 'models/**'
              - 'router/**'
              - 'templates/**'
              - 'types/**'
              - 'utils/**'
              - 'worker/**'
              - 'go.mod'
              - 'go.sum'
              - 'run-demo.sh'
              - '.github/workflows/ci.yml'
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Run build
        run: go build -o auth-proxy-server ./cmd/server && go build -o admin-cli ./cmd/admin-cli

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Check formatting
        run: |
          gofmt_output=$(gofmt -l .)
          if [ -n "$gofmt_output" ]; then
            echo "The following files are not formatted correctly:"
            echo "$gofmt_output"
            exit 1
          fi
          echo "All files are correctly formatted."

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
