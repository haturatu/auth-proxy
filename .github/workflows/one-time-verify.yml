name: One-time verify fix/issue-8-atomic-refresh-rotation

on:
  push:
    branches:
      - 'fix/issue-8-atomic-refresh-rotation'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tests, remove verifier and report failures
        shell: bash
        run: |
          set +e
          go test ./... > /tmp/credential-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 200 /tmp/credential-tests.log > .temporary-ci-failure.txt
            git add -f .temporary-ci-failure.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-verify.yml
          git diff --cached --quiet || git commit -m "test: record credential regression outcome"
          git push origin HEAD:fix/issue-8-atomic-refresh-rotation
          exit "$status"
