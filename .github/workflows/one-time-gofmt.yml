name: One-time formatting for issue 9

on:
  push:
    branches:
      - 'refactor/rebase-issue-50-on-main'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run gofmt and remove temporary workflow
        run: |
          gofmt -w .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/one-time-gofmt.yml
          git diff --cached --quiet || git commit -m "style: format updated JWT credential-bound auth"
          git push origin HEAD:refactor/rebase-issue-50-on-main
