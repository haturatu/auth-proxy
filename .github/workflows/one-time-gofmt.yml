name: One-time format JWT integration

on:
  push:
    branches: ['refactor/issue-50-with-jwt-audience']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format JWT integration and remove workflow
        run: |
          gofmt -w .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/one-time-gofmt.yml
          git diff --cached --quiet || git commit -m "style: format credential and audience JWT integration"
          git push origin HEAD:refactor/issue-50-with-jwt-audience
