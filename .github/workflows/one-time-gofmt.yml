name: One-time format security/issue-59-username-collation

on:
  push:
    branches:
      - 'security/issue-59-username-collation'

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: gofmt and remove temporary formatter
        run: |
          gofmt -w .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/one-time-gofmt.yml
          git diff --cached --quiet || git commit -m "style: gofmt and remove temporary formatter"
          git push origin HEAD:security/issue-59-username-collation
