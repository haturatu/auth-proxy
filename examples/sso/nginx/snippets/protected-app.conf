# Include inside the application's location block.
auth_request /_auth/check;
error_page 401 = @sso_start;

auth_request_set $auth_user $upstream_http_x_auth_request_user;
auth_request_set $auth_user_id $upstream_http_x_auth_request_user_id;
auth_request_set $auth_role $upstream_http_x_auth_request_role;
auth_request_set $app_cookies $upstream_http_x_auth_request_cookie;

proxy_set_header X-Auth-Request-User $auth_user;
proxy_set_header X-Auth-Request-User-ID $auth_user_id;
proxy_set_header X-Auth-Request-Role $auth_role;
proxy_set_header X-Auth-Request-JWT "";
proxy_set_header X-Username $auth_user;
proxy_set_header X-User-Role $auth_role;
proxy_set_header Remote-User "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Goog-Authenticated-User-Email "";
proxy_set_header X-Goog-Authenticated-User-ID "";
proxy_set_header X-Amzn-Oidc-Identity "";
proxy_set_header X-Amzn-Oidc-Data "";
proxy_set_header X-Amzn-Oidc-Accesstoken "";
proxy_set_header Cf-Access-Jwt-Assertion "";
proxy_set_header X-Goog-Iap-Jwt-Assertion "";
proxy_set_header Authorization "";
proxy_set_header Cookie $app_cookies;

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_buffering off;
proxy_cache off;
add_header Cache-Control "private, no-store" always;
add_header Vary Cookie always;
