# Include at server scope. Named error handling preserves the original method;
# proxy_method changes only the internal HTTP call to auth-proxy.
set $auth_original_method $request_method;

location = /_auth/check {
    internal;
    # The filtered application Cookie travels back as a response header.
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_pass http://auth_backend/internal/authz;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host auth.example.com;
    proxy_set_header X-Auth-App-ID $auth_app_id;
    proxy_set_header X-Original-Host $http_host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $auth_original_method;
    proxy_set_header X-Original-Origin $http_origin;
    proxy_set_header X-Original-Fetch-Mode $http_sec_fetch_mode;
    proxy_set_header X-Original-Fetch-Site $http_sec_fetch_site;
    proxy_set_header X-Original-Upgrade $http_upgrade;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
}

location @sso_start {
    # A URI in proxy_pass is not allowed in a named location. Rewrite without
    # the original query string, which is carried in X-Original-URI instead.
    rewrite ^ /gateway/start? break;
    proxy_pass http://auth_backend;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host auth.example.com;
    proxy_set_header X-Auth-App-ID $auth_app_id;
    proxy_set_header X-Original-Host $http_host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $auth_original_method;
    proxy_set_header X-Original-Accept $http_accept;
    proxy_set_header X-Original-Fetch-Mode $http_sec_fetch_mode;
    proxy_set_header X-Original-Fetch-Dest $http_sec_fetch_dest;
    proxy_set_header X-Original-Upgrade $http_upgrade;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
}

location = /_auth/callback {
    limit_except GET { deny all; }
    # Standard Nginx error messages can include the full upstream URI.
    # Keep callback authorization codes out of those messages as well.
    error_log /dev/null;
    proxy_pass http://auth_backend/gateway/callback;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host auth.example.com;
    proxy_set_header X-Auth-App-ID $auth_app_id;
    proxy_set_header X-Original-Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    # Do not cache or disclose authorization codes in a Referer.
    add_header Referrer-Policy no-referrer always;
}

location = /_auth/logout {
    limit_except POST { deny all; }
    proxy_pass http://auth_backend/gateway/logout;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host auth.example.com;
    proxy_set_header X-Auth-App-ID $auth_app_id;
    proxy_set_header X-Original-Host $http_host;
    proxy_set_header X-Original-Method $auth_original_method;
    proxy_set_header X-Original-Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
}

location ^~ /_auth/ { return 404; }
