worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    # Never record query strings: callbacks contain authorization codes.
    log_format sso '$remote_addr $host $request_method $uri $status';
    access_log /var/log/nginx/access.log sso;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream auth_backend { server 127.0.0.1:8080; }
    upstream app_a { server 127.0.0.1:8081; }
    upstream app_b { server 127.0.0.1:8082; }

    # Replace with certificates covering all three public hosts, or move these
    # directives into each virtual host for separate certificates.
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 443 ssl default_server;
        server_name _;
        return 421;
    }

    include /etc/nginx/conf.d/*.conf;
}
