services:
  auth-proxy:
    environment:
      # Set DB_PASSWORD to a URI-safe value, for example openssl rand -hex 24.
      DATABASE_URL: "postgres://${DB_USER:-auth}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-auth}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$$POSTGRES_USER -d $$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
