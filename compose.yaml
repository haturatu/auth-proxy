services:
  auth-proxy:
    build: .
    restart: unless-stopped
    environment:
      LISTEN_PORT: "8080"
      TARGET_URL: ${TARGET_URL:?Set TARGET_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      XSRF_SECRET_KEY: ${XSRF_SECRET_KEY:?Set XSRF_SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_PATH: /data/auth.db
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FRONTEND_TYPE: ${FRONTEND_TYPE:-js}
      PROTECT_FRONTEND: ${PROTECT_FRONTEND:-true}
      PROTECT_API: ${PROTECT_API:-true}
      API_AUTH_MODE: ${API_AUTH_MODE:-bearer}
      API_SESSION_CSRF: ${API_SESSION_CSRF:-origin}
      UPSTREAM_ASSERTION_ED25519_SEED: ${UPSTREAM_ASSERTION_ED25519_SEED:-}
      UPSTREAM_ASSERTION_AUDIENCE: ${UPSTREAM_ASSERTION_AUDIENCE:-}
      UPSTREAM_ASSERTION_AS_BEARER: ${UPSTREAM_ASSERTION_AS_BEARER:-false}
      REGISTER: ${REGISTER:-true}
      FRONT_PATH: ${FRONT_PATH:-/}
      API_PATH: ${API_PATH:-/api/}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-10}
      USER_CREATION_RATE_LIMIT_MAX_REQUESTS: ${USER_CREATION_RATE_LIMIT_MAX_REQUESTS:-5}
      USER_CREATION_RATE_LIMIT_WINDOW_SECONDS: ${USER_CREATION_RATE_LIMIT_WINDOW_SECONDS:-3600}
      PASSWORD_POLICY: ${PASSWORD_POLICY:-standard}
      TOKEN_DURATION_HOURS: ${TOKEN_DURATION_HOURS:-24}
      ACCESS_TOKEN_DURATION_MINUTES: ${ACCESS_TOKEN_DURATION_MINUTES:-15}
      REFRESH_TOKEN_DURATION_DAYS: ${REFRESH_TOKEN_DURATION_DAYS:-7}
      AUTH_PATH_LOGIN: ${AUTH_PATH_LOGIN:-/login}
      AUTH_PATH_REGISTER: ${AUTH_PATH_REGISTER:-/register}
      AUTH_PATH_LOGOUT: ${AUTH_PATH_LOGOUT:-/logout}
      AUTH_PATH_ACCOUNT: ${AUTH_PATH_ACCOUNT:-/account}
      AUTH_PATH_ACCOUNT_PASSWORD: ${AUTH_PATH_ACCOUNT_PASSWORD:-/account/password}
      AUTH_PATH_ADMIN: ${AUTH_PATH_ADMIN:-/admin}
      AUTH_PATH_ADMIN_USERS_API: ${AUTH_PATH_ADMIN_USERS_API:-/api/admin/users}
      AUTH_ASSETS_PATH: ${AUTH_ASSETS_PATH:-/assets}
      PHP_FPM_SOCKET: ${PHP_FPM_SOCKET:-/run/php-fpm/php-fpm.sock}
      PHP_DOC_ROOT: ${PHP_DOC_ROOT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AUTH_PORT:-8080}:8080"
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
